<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="contact.css" />
    <link rel="stylesheet" href="./nav.css" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Roboto+Mono:wght@500;700&display=swap"

    />
    <link

  <body>
    <header>
      <h2>contact us</h2>
      <nav>
        <ul>
          <li><a href="#home">Home</a></li>
          <li><a href="#menu">Menu</a></li>
          <li><a href="#about">About us</a></li>
          <li><a href="#contact">Contact us</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section class="form">
        <div class="input-wrapper">
          <label for="name">Name:</label>
          <input type="name" placeholder="username" /><br />
          <label for="email">Email:</label>
          <input type="email" placeholder="enter email" /><br />
          <label for="phone">Phone:</label>
          <input type="phone" placeholder="enter phone" /><br />
          <label for="Message ">Message box:</label><br />
          <textarea type="text" id="Message" placeholder="enter message"></textarea>
          <br />
          <button>submit</button>
        </div>
      </section>
    </main>
  </body>
</html>
